openapi: 3.0.1
info:
  title: Yandex Go 2025 Calc service
  version: version not set
  description: >
    API для конкурентного вычисления ООООЧЕНЬ сложных математических операций(калькулятор)
tags:
  - name: Expressions
    description: 'Управление выражениями: создание и получение'
  - name: Users
    description: 'Управление пользователями: регистрация и авторизация'
servers:
- url: http://localhost:9090/api/v1
components:
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    usersRoute.RespRegisterDto:
          properties:
            token:
              type: string
          type: object
    Error:
      type: object
      description: Ответ с описанием ошибки
      properties:
        status:
          type: string
          description: Статус ответа
          example: "error"
        message:
          type: string
          description: Информация о ошибке
          example: "error message"
      required:
        - status
        - message
    registerReq:
      type: object
      properties:
        login:
          type: string
          description: Ваш логин
          example: "user_12345"
          minimum: 1
          maximum: 120
        password:
          type: string
          description: пароль, должен содерджать как минимум 1 цифру, символ, например !, строчную и прописную буквку и быть минимум 8 знаков в длину
          example: "passworD!2"
          minimum: 8
          maximum: 60
      required:
        - login
        - password
    createExpressionReq:
      type: object
      properties:
        expression:
          type: string
          description: Выражение которое нужно вычислить
          example: "log(18,18)^(-9)/3.14*(-12-3)*3/(-10)+2*sqrt(4)"
      required:
        - expression
    createExpressionResp:
      type: object
      properties:
        id:
          type: integer
          description: ID созданного выражения
          format: int64
          minimum: 1
          example: 1
      required:
        - id
    getExpression:
      type: object
      properties:
        id:
          type: integer
          description: ID выражения
          format: int64
          minimum: 1
          example: 1
        status:
          type: string
          description: Статус выражания
          example: "Waiting"
        result:
          type: number
          description: Результат выражения если оно решено
          format: double
          example: 0.2
      required:
        - id
        - status
    getTask:
      type: object
      properties:
        id:
          type: integer
          description: ID выражения
          format: int64
          minimum: 1
          example: 1
        arg1:
          type: number
          description: Первый аргумент операции
          format: double
          example: 0.3
        arg2:
          type: number
          description: Второй аргумент операции, может быть ненужным
          format: double
          example: 0.5
        operation:
          type: integer
          description: Операция в виде byte числа
          format: int32
          example: 0
        operation_time:
          type: integer
          description: Время выполнения операции в мс
          example: 1000000
      required:
        - id
        - arg1
        - operation
        - operation_time
    postResult:
      type: object
      properties:
        id:
          type: integer
          description: ID задачи
          format: int64
          minimum: 1
          example: 1
        expression_id:
          type: integer
          description: ID выражения
          format: int64
          minimum: 1
          example: 1
        result:
          type: number
          description: Результат выполнения операции если она выполнима
          format: double
          example: 0.5
        error:
          type: string
          description: Сообщение ошибки если операция не выполнима
          example: Division by zero
      required:
        - id
        - expression_id
paths:
  /calculate:
    post:
      security:
        - Bearer: []
      tags:
        - Expressions
      summary: Создание выражения

      description: Возвращает ID выражения
      operationId: createExpression
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createExpressionReq'
        required: true
      responses:
        "201":
          description: Выражение принято для вычисления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createExpressionResp'
        "400":
          description: Невалидное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Ошибка авторизации
          schema:
            $ref: '#/components/schemas/Error'
        "422":
          description: Невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /expressions:
    get:
      security:
        - Bearer: [ ]
      tags:
        - Expressions
      summary: Получение выражений с пагинацией в порядке создания от новых к старым
      description: Возвращает список выражений и общее количество выражений
      operationId: getExpressions
      parameters:

      - in: query
        name: size
        schema:
          type: integer
        description: Количество элементов на странице.
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы.
      responses:
        "200":
          description: Список выражений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/createExpressionResp'
        "404":
          description: Выражений не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Ошибка авторизации
          schema:
            $ref: '#/components/schemas/Error'
        "500":
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /expressions/{id}:
    get:
      security:
        - Bearer: [ ]
      tags:
        - Expressions
      summary: Получение выражения по ID
      description: Возвращает выражение по ID
      operationId: getExpression
      parameters:

      - in: path
        name: id
        required: true
        description: ID выражения
        schema:
          type: number
          format: int64
          minimum: 1
          example: 1
      responses:
        "200":
          description: Список выражений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createExpressionResp'
        "404":
          description: Выражений не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Ошибка авторизации
          schema:
            $ref: '#/components/schemas/Error'
        "500":
          description: Внутренняя ошибка сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /register:
    post:
      tags:
        - Users
      summary: Регистрация пользователя
      description: Возвращает токен который в дальнейшем нужно использовать
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/registerReq'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/usersRoute.RespRegisterDto'
        "400":
          description: Ошибка валидации
          schema:
            $ref: '#/components/schemas/Error'
        "409":
          description: Пользователь с таким login уже зарегистрирован
          schema:
            $ref: '#/components/schemas/Error'
        "500":
          description: Что-то пошло не так
          schema:
            $ref: '#/components/schemas/Error'
  /login:
    post:
      tags:
        - Users
      summary: Аутентификация пользователя
      description: Возвращает токен который в дальнейшем нужно использовать
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/registerReq'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/usersRoute.RespRegisterDto'
        "400":
          description: Ошибка валидации
          schema:
            $ref: '#/components/schemas/Error'
        "401":
          description: Ошибка авторизации
          schema:
            $ref: '#/components/schemas/Error'
        "500":
          description: Что-то пошло не так
          schema:
            $ref: '#/components/schemas/Error'
